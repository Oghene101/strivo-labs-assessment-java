spring.profiles.active=development

spring.application.name=strivo-labs-assessment-java

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# let flyway handle schema creation
# correct - value only, comment on separate line
# only validates entities match DB, never changes it
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# flyway config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# outbox processing config
outbox.scheduler.delay-ms=15000
outbox.batch-size=20
outbox.max-retries=3
outbox.retry-delay-seconds=30

# mail config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# jwt config
jwt.private-key=
jwt.public-key=
jwt.expiration-ms=900000